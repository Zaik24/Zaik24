    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Carga no bloqueante (display=swap): el texto se pinta de inmediato con la fuente del sistema -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@700;800&family=Inter:wght@400;500;600&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@700;800&family=Inter:wght@400;500;600&display=swap"
      media="print"
      onload="this.media='all'"
    />

        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@700;800&family=Inter:wght@400;500;600&display=swap"

    <!-- LCP: primer fotograma del hero -->
    <link rel="preload" as="image" href="/assets/hero-start-mobile.webp" type="image/webp" media="(max-width: 767px)" fetchpriority="high" />
    <link rel="preload" as="image" href="/assets/hero-start.webp" type="image/webp" media="(min-width: 768px)" fetchpriority="high" />

          { "@type": "Offer", "name": "Paquete 10 videos", "price": "1397", "priceCurrency": "USD" }
        ]
      }
    </script>
