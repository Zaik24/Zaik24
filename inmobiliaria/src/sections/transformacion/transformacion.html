<section class="section section--white transformacion" id="transformacion" aria-labelledby="transformacion-title">
  <div class="container">
    <div class="transformacion__head">
      <h2 class="h2" id="transformacion-title" data-reveal>De una imagen a una experiencia.</h2>
      <p class="body-lg" data-reveal>Transformamos el material de tu proyecto en contenido visual que captura la atención.</p>
    </div>

    <div class="compare">
      <figure class="compare__item compare__item--before" data-reveal>
        <span class="compare__tag">01 · Material original</span>
        <div class="compare__frame media">
          <img
            src="/assets/img/material-original.webp"
            alt="Carpeta del proyecto Asia Sunset: plano de lotes, fotos del terreno, renders y logotipos enviados por el cliente"
            width="1025"
            height="773"
            loading="lazy"
            decoding="async"
          />
        </div>
        <figcaption>Planos, renders o fotografías que nos compartes.</figcaption>
      </figure>

      <span class="compare__arrow" aria-hidden="true">→</span>

      <figure class="compare__item compare__item--after" data-reveal>
        <span class="compare__tag compare__tag--brand">02 · Resultado %VITE_BRAND_NAME%</span>
        <div class="compare__frame compare__frame--video media">
          <video
            muted
            loop
            playsinline
            preload="none"
            poster="/assets/video/asia-sunset-poster.webp"
            width="540"
            height="960"
            aria-label="Video terminado del condominio Asia Sunset"
            data-autoplay
          >
            <source src="/assets/video/asia-sunset.mp4" type="video/mp4" />
          </video>
          <button class="sound-toggle" type="button" aria-pressed="false" data-sound-toggle>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" /><path class="sound-toggle__off" d="m16 9 5 6m0-6-5 6" /><path class="sound-toggle__on" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" /></svg>
            <span class="sound-toggle__label">Activar sonido</span>
          </button>
        </div>
        <figcaption>Un video dinámico con movimiento, profundidad y narrativa visual.</figcaption>
      </figure>
    </div>

    <div class="transformacion__cta" data-reveal>
      <a
        class="btn btn--dark btn--lg"
        href="https://wa.me/%VITE_WHATSAPP%?text=Hola,%20quiero%20transformar%20mi%20proyecto%20con%20StateView"
        target="_blank"
        rel="noopener"
      >
        Quiero transformar mi proyecto <span class="btn__arrow" aria-hidden="true">→</span>
      </a>
    </div>
  </div>
</section>
