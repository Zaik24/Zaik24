<section class="hero" aria-labelledby="hero-title" data-hero>
  <div class="hero__sticky">
    <div class="hero__media" aria-hidden="true">
      <picture>
        <source media="(max-width: 767px)" srcset="/assets/hero-start-mobile.webp" type="image/webp" />
        <source srcset="/assets/hero-start.webp" type="image/webp" />
        <img
          class="hero__poster"
          src="/assets/hero-start.jpg"
          alt=""
          width="1920"
          height="1080"
          fetchpriority="high"
          decoding="async"
        />
      </picture>
      <canvas class="hero__canvas" data-hero-canvas></canvas>
    </div>

    <!-- Al final del scroll, el borde inferior de las nubes se funde con el fondo de la sección siguiente -->
    <div class="hero__fade" aria-hidden="true" data-hero-fade></div>

    <!-- 90–100%: entre las nubes, el logo con la casa terminada dentro de las letras -->
    <div class="hero__outro" aria-hidden="true" data-hero-outro>
      <p
        class="hero__outro-logo"
        style="background-image: linear-gradient(rgba(45, 22, 6, 0.28), rgba(45, 22, 6, 0.28)), url(/assets/hero-house.webp)"
      >%VITE_BRAND_NAME%</p>
      <p class="hero__outro-sub">Real Estate</p>
    </div>

    <!-- Bruma clara detrás del texto: el titular oscuro se lee sobre el cielo -->
    <div class="hero__scrim" aria-hidden="true" data-hero-scrim></div>

    <div class="hero__content container">
      <!-- 0–15%: titular y subtítulo -->
      <div class="hero__intro" data-hero-text>
        <h1 class="hero__title" id="hero-title" data-hero-intro>Hacemos visible el&nbsp;futuro.</h1>
        <p class="hero__lead" data-hero-intro>
          <span class="hero__lead-strong">Videos publicitarios con renders 3D.</span>
          <span class="hero__lead-soft">Proyectos inmobiliarios que cobran vida.</span>
        </p>
      </div>
    </div>

    <!-- 70–85%: casa terminada -->
    <div class="hero__cta" data-hero-cta>
      <a class="btn btn--light btn--lg" href="#clientes">Ver proyectos <span class="btn__arrow" aria-hidden="true">→</span></a>
    </div>
  </div>
</section>
